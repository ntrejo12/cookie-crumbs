services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL}
        VITE_NEON_DATA_API_URL: ${VITE_NEON_DATA_API_URL}
        VITE_API_BASE_URL: ""
        VITE_HANDOFF_DEBUG: ${VITE_HANDOFF_DEBUG:-false}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
